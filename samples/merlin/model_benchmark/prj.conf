#
# Zephyr application config for the Merlin / IREE model benchmark on
# chipyard_riscv64 + FireSimQuadRocketConfig (4 Rocket harts, RV64GC + RVV).
#
# IREE is linked under IREE_PLATFORM_GENERIC (single-threaded local-sync).
# Multi-hart parallelism is at the app layer: the sample spawns up to
# CONFIG_MERLIN_IREE_NUM_WORKERS k_threads, each with its own
# iree_vm_context invoking module.main on a private slice of the batch.

# --- Merlin / IREE module ---------------------------------------------------

CONFIG_MERLIN_IREE=y
CONFIG_MERLIN_IREE_NUM_WORKERS=4

# --- SMP: 4 harts to match FireSimQuadRocketConfig --------------------------

CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y

# --- Floating-point ---------------------------------------------------------

CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_FPU_SHARING=y

# --- Heap / stacks ----------------------------------------------------------
#
# IREE arenas can grow into the tens of MB for non-trivial models. The
# chipyard_riscv64 board exposes a 256MB ram0 region so 64MB is comfortable.

CONFIG_HEAP_MEM_POOL_SIZE=67108864
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_PRIVILEGED_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Console / printk ------------------------------------------------------

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_HTIF=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- libc -----------------------------------------------------------------
#
# newlib: matches the libc the merlin `zephyr` profile builds the IREE
# archives against (cross-compile/riscv64-unknown-elf-gcc + newlib
# sysroot). Picolibc would mismatch on _impure_ptr / __errno / __assert_func
# / strtod and fail to link against the IREE archives. The Zephyr-required
# _RETARGETABLE_LOCKING static_assert in libc-hooks.c is satisfied because
# CONFIG_NEWLIB_LIBC selects the toolchain that defines _RETARGETABLE_LOCKING
# (riscv-tools' gcc 13.2.0 enables it by default).
CONFIG_NEWLIB_LIBC=y

# --- Cycle counter (for the CSV throughput row) ----------------------------

CONFIG_TIMING_FUNCTIONS=y

# --- Optimisation ----------------------------------------------------------

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_LTO=n
